# Nginx — www.zwacar.space (zwacar.space et HTTP redirigés). Installé par deploy/server-setup.sh.
# L'API ZwaCar (PM2, port __PORT__) sert aussi le Web Admin (SERVE_WEB=true).
server {
    listen 80;
    listen [::]:80;
    server_name www.zwacar.space zwacar.space;
    return 301 https://www.zwacar.space$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zwacar.space;
    ssl_certificate     /etc/letsencrypt/live/www.zwacar.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zwacar.space/privkey.pem;
    return 301 https://www.zwacar.space$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.zwacar.space;

    ssl_certificate     /etc/letsencrypt/live/www.zwacar.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zwacar.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Vidéo 20 Mo + jusqu'à 12 photos de 10 Mo par envoi
    client_max_body_size 150m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
